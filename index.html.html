function renderResults(){const rev=data.counts.kits*79.9,cost=data.costs.reduce((s,x)=>s+x.qty*x.unit,0),result=rev-cost;resultados.innerHTML=`${head('Resultados','Desempenho consolidado do evento')}<div class="result-hero"><div class="card result-main"><span class="label">RESULTADO DO EVENTO</span><div class="money">${money(result)}</div><div class="delta">Faturamento de ${money(rev)} · custo de ${money(cost)}</div></div><div class="card"><div class="donut-row"><div class="donut"></div><div class="metric-list"><div><span>Meta de adoções</span><b>${data.counts.adoptions} de 110</b></div><div><span>Taxa de adoção</span><b>${Math.round(data.counts.adoptions/110*100)}%</b></div></div></div></div></div><div class="kpis"><div class="kpi"><div class="kpi-top"><span>CONVERSÃO EM KITS</span></div><div class="num">${Math.round(data.counts.kits/data.counts.adoptions*100)}%</div><div class="trend neutral">${data.counts.kits} kits vendidos</div></div><div class="kpi"><div class="kpi-top"><span>FLUXO TOTAL</span></div><div class="num">${data.counts.flow}</div><div class="trend neutral">pessoas registradas</div></div><div class="kpi"><div class="kpi-top"><span>ESCOLAS TRABALHADAS</span></div><div class="num">4</div><div class="trend neutral">2.340 alunos estimados</div></div><div class="kpi"><div class="kpi-top"><span>TICKET MÉDIO</span></div><div class="num">${money(rev/Math.max(data.counts.kits,1))}</div><div class="trend neutral">por kit vendido</div></div></div>`}

${x.pay===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Comprovante</label><input name="receipt" value="${x.receipt||''}" placeholder="Nome do arquivo"></div><div class="field full"><label>Observação</label><textarea name="obs">${x.obs||''}</textarea></div></div>`}else{title='Registrar ocorrência';html=`<div class="field"><label>Observação do evento</label><textarea name="note" required placeholder="Descreva o que aconteceu e, se necessário, quem ficou responsável."></textarea></div>`}modalTitle.textContent=title;formBody.innerHTML=html;setTimeout(()=>formBody.querySelector('input,textarea,select')?.focus(),60)}

function actionButton(type,key){return `<button class="action" aria-label="Opções" aria-haspopup="menu" aria-expanded="false" onclick="openActionMenu(event,'${type}',${key})">•••</button>`}
function openActionMenu(ev,type,key){
  ev.stopPropagation();
  document.querySelectorAll('.action').forEach(x=>x.setAttribute('aria-expanded','false'));
  const button=ev.currentTarget,rect=button.getBoundingClientRect();
  button.setAttribute('aria-expanded','true');
  actionMenu.innerHTML=`<button role="menuitem" onclick="editItem('${type}',${key})">✎&nbsp;&nbsp;Editar</button><button role="menuitem" class="delete" onclick="deleteItem('${type}',${key})">×&nbsp;&nbsp;Apagar</button>`;
  actionMenu.classList.add('open');
  const width=156,left=Math.min(window.innerWidth-width-10,Math.max(10,rect.right-width));
  actionMenu.style.left=left+'px';
  actionMenu.style.top=Math.min(window.innerHeight-104,rect.bottom+6)+'px';
}
function closeActionMenu(){actionMenu.classList.remove('open');document.querySelectorAll('.action').forEach(x=>x.setAttribute('aria-expanded','false'))}
function editItem(type,key){closeActionMenu();openModal(type,key)}
function deleteItem(type,key){
  const labels={event:'este evento',material:'este material',school:'esta escola',structure:'este item de estrutura',cost:'este custo'};
  if(!confirm(`Apagar ${labels[type]}? Esta ação não poderá ser desfeita.`))return;
  if(type==='event')data.events=data.events.filter(x=>x.id!==key);
  if(type==='cost')data.costs=data.costs.filter(x=>x.id!==key);
  if(type==='material')data.materials.splice(key,1);
  if(type==='school')data.schools.splice(key,1);
  if(type==='structure')data.structure.splice(key,1);
  closeActionMenu();persist();render();toast('Registro apagado');
}
function opts(values,current){return values.map(v=>`<option ${v===current?'selected':''}>${v}</option>`).join('')}

  closeActionMenu();editing={type,id};modalBack.classList.add('open');let title='',html='';const editingExisting=id!==null;

  modalTitle.textContent=title;formBody.innerHTML=html;setTimeout(()=>formBody.querySelector('input,textarea,select')?.focus(),60);

function saveForm(ev){
  ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target)),current={...editing};
  if(current.type==='event'){const obj={id:current.id||Date.now(),store:f.store,date:f.date,owner:f.owner,status:f.status,progress:+f.progress,city:f.city};const i=data.events.findIndex(x=>x.id===current.id);i>=0?data.events[i]=obj:data.events.unshift(obj)}
  if(current.type==='material'){const obj=[f.name,+f.planned,+f.confirmed,+f.delivered];current.id!==null?data.materials[current.id]=obj:data.materials.push(obj)}
  if(current.type==='school'){const obj=[f.name,+f.distance,f.contact,f.phone,+f.students,f.status];current.id!==null?data.schools[current.id]=obj:data.schools.push(obj)}
  if(current.type==='structure'){const obj=[f.name,+f.qty,f.owner,f.status,f.obs];current.id!==null?data.structure[current.id]=obj:data.structure.push(obj)}
  if(current.type==='cost'){const obj={id:current.id||Date.now(),desc:f.desc,cat:f.cat,vendor:f.vendor,qty:+f.qty,unit:+f.unit,pay:f.pay,receipt:f.receipt||'Pendente',obs:f.obs};const i=data.costs.findIndex(x=>x.id===current.id);i>=0?data.costs[i]=obj:data.costs.unshift(obj)}
  persist();closeModal();render();toast(current.type==='note'?'Ocorrência registrada':'Alterações salvas');
}
function exportReport(){const text=`RESUMO — EVENTO VILA MARIANA\nAdoções: ${data.counts.adoptions}\nKits vendidos: ${data.counts.kits}\nFluxo: ${data.counts.flow}\nCustos: ${money(data.costs.reduce((s,x)=>s+x.qty*x.unit,0))}`;navigator.clipboard?.writeText(text);toast('Resumo copiado para a área de transferência')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('click',e=>{if(!e.target.closest('.action-menu')&&!e.target.closest('.action'))closeActionMenu()});
window.addEventListener('resize',closeActionMenu);window.addEventListener('scroll',closeActionMenu,true);
if(document.modelContext?.registerTool){document.modelContext.registerTool({name:'registrar_movimento_evento',title:'Registrar movimento',description:'Adiciona adoções, kits vendidos ou fluxo de pessoas ao evento atual.',inputSchema:{type:'object',properties:{tipo:{type:'string',enum:['adoptions','kits','flow']},quantidade:{type:'integer',minimum:1}},required:['tipo','quantidade'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:({tipo,quantidade})=>{if(!['adoptions','kits','flow'].includes(tipo)||!Number.isInteger(quantidade)||quantidade<1)throw new Error('Entrada inválida');data.counts[tipo]+=quantidade;persist();render();return{tipo,total:data.counts[tipo]}}})}
buildNav();render();
</script>
